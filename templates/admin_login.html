{% extends "base.html" %}
{% block title %}Admin · JWLSync{% endblock %}
{% block subheading %}Admin{% endblock %}
{% block content %}
<div class="section">
    <div class="section-title">Authentication</div>
    {% if error %}<div class="status-display bad">{{ error }}</div>{% endif %}
    <form class="row" method="post" action="{{ url_for('admin_login') }}">
        <input type="password" name="admin_code" placeholder="Admin code" aria-label="Admin code" required autofocus>
        <button>Sign In</button>
    </form>
</div>
{% endblock %}
